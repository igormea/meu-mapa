name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        working-directory: app
        run: npm install

      - name: Criar projeto Android
        working-directory: app
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#3a281a' --splashBackgroundColor '#2a1c12' || echo "ícones: usando padrão"
          npx cap sync android
          python3 patch_manifest.py

      - name: Compilar APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android
          cp ../meumapa.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../meu-mapa-rpg.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Meu Mapa RPG — APK
          body: |
            Baixe o arquivo **meu-mapa-rpg.apk** abaixo pelo celular e instale.
            Gerado automaticamente a partir do commit ${{ github.sha }}.
          files: meu-mapa-rpg.apk
          make_latest: true
