name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee build.log
          (
            set -e
            cd app
            npm install
            npx cap add android
            npx @capacitor/assets generate --android --iconBackgroundColor '#1d3b5c' --splashBackgroundColor '#0e1a34' || echo "icones: usando padrao"
            npx cap sync android
            python3 patch_manifest.py
            VCODE=$((100 + ${{ github.run_number }})) python3 patch_gradle.py
            # a chave fixa do projeto (o Gradle novo procura em ~/.config/.android; sem ela, gera uma chave nova a cada build)
            mkdir -p ~/.android ~/.config/.android
            cp meumapa.keystore ~/.android/debug.keystore
            cp meumapa.keystore ~/.config/.android/debug.keystore
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../ranvus-maps.apk && cp ../../ranvus-maps.apk ../../meu-mapa-rpg.apk
            # pacote da Play Store (AAB), assinado com a mesma chave
            ./gradlew bundleRelease --no-daemon
            cp app/build/outputs/bundle/release/app-release.aab ../../ranvus-maps.aab
          ) 2>&1 | tee -a build.log

      - name: Conferir chave de assinatura
        shell: bash
        run: |
          echo "HOME=$HOME ANDROID_USER_HOME=${ANDROID_USER_HOME:-} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-}"
          ls -la ~/.android/ || true
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E "SHA1|Alias" || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1); $BT/apksigner verify --print-certs ranvus-maps.apk | grep -i sha-1 || true
          $BT/apksigner verify --print-certs ranvus-maps.apk | grep -qi "33ad99e32c1f4f4241101e6f2c618b1f1c71db0f" || { echo "::error::APK assinado com a chave errada"; exit 1; }
          keytool -printcert -jarfile ranvus-maps.aab | grep -i "SHA1" || true
          keytool -printcert -jarfile ranvus-maps.aab | grep -qi "33:AD:99:E3:2C:1F:4F:42:41:10:1E:6F:2C:61:8B:1F:1C:71:DB:0F" || { echo "::error::AAB assinado com a chave errada"; exit 1; }
          (cd app/android && ./gradlew signingReport --no-daemon -q 2>/dev/null | grep -E "Variant|SHA1|Store" | head -12) || true

      - name: Mostrar erro
        if: failure()
        shell: bash
        run: |
          grep -iE "error|failed|what went wrong|could not|exception" build.log | tail -25 > err.txt || true
          [ -s err.txt ] || tail -25 build.log > err.txt
          msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Erro na compilacao::${msg}"

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Ranvus Maps — APK
          body: |
            Baixe o arquivo **ranvus-maps.apk** abaixo pelo celular e instale.
            Gerado automaticamente a partir do commit ${{ github.sha }}.
          files: |
            ranvus-maps.apk
            meu-mapa-rpg.apk
            ranvus-maps.aab
          make_latest: true
