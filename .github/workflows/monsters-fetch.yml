name: Baixar pacotes de monstros (CC0)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/monsters-fetch.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar do OpenGameArt (Quaternius, CC0)
        shell: bash {0}
        run: |
          mkdir -p out && cd out
          get(){ curl -sSfL --retry 3 --retry-all-errors -A "Mozilla/5.0" -o "$2" "$1" && echo "ok $2 $(stat -c%s "$2")" || echo "FALHOU $1"; }
          get "https://opengameart.org/sites/default/files/Animated%20Monster%20Pack%20by%20%40Quaternius.zip" quaternius_monsters_2018.zip
          get "https://opengameart.org/sites/default/files/cute_animated_monsters_-_aug_2020.zip" quaternius_cute_monsters.zip
          ( for u in "https://opengameart.org/content/lowpoly-animated-monsters" "https://opengameart.org/content/textured-cute-monster-pack"; do
              echo "== página $u"; curl -sSL -A "Mozilla/5.0" "$u" | grep -oE 'https://opengameart.org/sites/default/files/[^"]+\.zip' | sort -u; done ) | tee paginas.txt
          for link in $(grep -oE 'https://opengameart.org/sites/default/files/[^ ]+\.zip' paginas.txt | sort -u); do get "$link" "$(basename "$link" | sed 's/%20/_/g;s/%40//g')"; done
          # mais pacotes: coleção CC0 da Quaternius (monstros/animais/criaturas) + 50+ Monsters (isaiah658, CC0)
          ( curl -sSL -A "Mozilla/5.0" "https://opengameart.org/content/all-cc0-uploader-quaternius" | grep -oE 'href="/content/[^"]+"' | sed 's/href="//;s/"//' | sort -u \
              | grep -iE "monster|animal|creature|enem|dragon|zombie|demon|ghost|slime|fish|bird|insect|spider|mech|robot|alien"; echo /node/167827 ) | tee paginas2.txt
          for pg in $(cat paginas2.txt); do echo "== página $pg" >> paginas.txt; curl -sSL -A "Mozilla/5.0" "https://opengameart.org$pg" | grep -oE 'https://opengameart.org/sites/default/files/[^"]+\.(zip|rar|7z)' | sort -u | tee -a paginas.txt; done
          for link in $(grep -oE 'https://opengameart.org/sites/default/files/[^ ]+\.zip' paginas.txt | sort -u); do f="$(basename "$link" | sed 's/%20/_/g;s/%40//g')"; [ -f "$f" ] || get "$link" "$f"; done
          # Ultimate Monsters (quaternius.com → Google Drive)
          pip install -q gdown >/dev/null 2>&1
          for pg in https://quaternius.com/packs/ultimatemonsters.html https://quaternius.com/packs/ultimateanimatedanimals.html; do
            echo "== site $pg" >> paginas.txt
            for d in $(curl -sSL -A "Mozilla/5.0" "$pg" | grep -oE 'https://drive\.google\.com/[^"]+' | sort -u); do echo "$d" >> paginas.txt; (cd "$(mktemp -d)" && gdown -q --fuzzy "$d" && for f in *; do mv "$f" "$OLDPWD/$(basename "$pg" .html)_$(echo "$f" | tr ' ' '_')"; done) || echo "FALHOU $d" >> paginas.txt; done
          done
          ( cat paginas.txt; ls -la; for z in *.zip; do [ -f "$z" ] || continue; echo "== $z"; unzip -l "$z" | awk '{print $4}' | grep -iE "\.(fbx|glb|gltf|png)$" | head -300; done ) > inventario.txt 2>&1
          cat inventario.txt; exit 0
      - name: Publicar para uso no app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monster-src
          name: Pacotes de monstros (fonte, CC0)
          body: Pacotes CC0 de Quaternius baixados do OpenGameArt, para converter em modelos do Ranvus Maps.
          files: |
            out/*.zip
            out/inventario.txt
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: false
