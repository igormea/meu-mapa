name: Atualizar dados do mapa (OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # toda segunda, 03:17 de Fortaleza
  push:
    branches: [main]
    paths: ['tools/osm_extract.py', 'tools/places_overpass.py', '.github/workflows/osm-data.yml']

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extrair (Geofabrik + osmium)
        shell: bash
        run: |
          set -o pipefail
          (
            set -x
            ok=0
            sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
            for url in https://download.geofabrik.de/south-america/brazil/nordeste-latest.osm.pbf \
                       https://download.openstreetmap.fr/extracts/south-america/brazil/nordeste/ceara-latest.osm.pbf; do
              if curl -sSfL --retry 4 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o src.osm.pbf "$url"; then
                ls -la src.osm.pbf
                osmium extract -b -41.45,-7.95,-37.20,-2.70 src.osm.pbf -o ce.osm.pbf --overwrite &&
                osmium tags-filter ce.osm.pbf n/highway=speed_camera n/enforcement=maxspeed n/traffic_calming \
                  n/barrier=toll_booth n/railway=level_crossing n/highway=traffic_signals \
                  nwr/amenity=parking,fuel,pharmacy -o f.osm.pbf --overwrite &&
                osmium export f.osm.pbf -f geojsonseq -o f.geojsonseq --overwrite &&
                python3 tools/osm_extract.py f.geojsonseq && { ok=1; break; }
              fi
              echo "fonte falhou: $url"
            done
            if [ $ok = 0 ]; then echo "plano B: Overpass"; python3 tools/osm_overpass.py && ok=1; fi
            [ $ok = 1 ]
          ) 2>&1 | tee osm.log

      - name: Índice de busca (ruas, bairros e lugares da Grande Fortaleza)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 tools/places_overpass.py 2>&1 | tee -a osm.log

      - name: Salvar no repositório
        if: always()
        shell: bash
        run: |
          git config user.name "meu-mapa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm-ce.json data/places.json 2>/dev/null || git add data/osm-ce.json
          git diff --cached --quiet || (git commit -m "Dados OSM atualizados" && git pull --rebase && git push) 2>&1 | tee -a osm.log

      - name: Publicar registro (para diagnóstico)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: osm-log
          name: Registro da extração OSM
          body: Registro da última execução do robô de dados.
          files: osm.log
          prerelease: true
          make_latest: false
