name: Atualizar dados do mapa (OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # toda segunda, 03:17 de Fortaleza
  push:
    branches: [main]
    paths: ['tools/osm_extract.py', '.github/workflows/osm-data.yml']

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Baixar extrato do Nordeste (Geofabrik) e filtrar o Ceará
        run: |
          curl -sSfL -o ne.osm.pbf https://download.geofabrik.de/south-america/brazil/nordeste-latest.osm.pbf
          osmium extract -b -41.45,-7.95,-37.20,-2.70 ne.osm.pbf -o ce.osm.pbf --overwrite
          osmium tags-filter ce.osm.pbf n/highway=speed_camera n/enforcement=maxspeed n/traffic_calming \
            n/barrier=toll_booth n/railway=level_crossing n/highway=traffic_signals \
            nwr/amenity=parking,fuel,pharmacy -o f.osm.pbf --overwrite
          osmium export f.osm.pbf -f geojsonseq -o f.geojsonseq --overwrite
      - name: Gerar data/osm-ce.json
        run: python3 tools/osm_extract.py f.geojsonseq | tee osm.log
      - name: Resumo
        if: always()
        run: echo "::notice title=Dados OSM::$(tr '\n' ' ' < osm.log 2>/dev/null)"
      - name: Salvar no repositório
        run: |
          git config user.name "meu-mapa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm-ce.json
          git diff --cached --quiet || (git commit -m "Dados OSM atualizados" && git pull --rebase && git push)
